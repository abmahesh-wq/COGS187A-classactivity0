<section id="dash" style="display:none"><div class="bar"><div><h1>COGS 187A · Instructor Review</h1><p class="muted" id="count"></p></div><button type="button" class="btn" id="signOut">Sign out</button></div><div class="activity-tabs"><button class="tabbtn active" data-target="activity0Panel">Class Activity 0</button><button class="tabbtn" data-target="activity1Panel">Class Activity 1</button></div><section id="activity0Panel" class="activity-panel active"><div id="overview"></div><div class="divider"></div><h2 class="section-title">Individual Group Submissions</h2><div id="list"></div></section><section id="activity1Panel" class="activity-panel"><div id="activity1Overview"></div><div class="divider"></div><h2 class="section-title">Activity 1 Group Submissions</h2><div id="activity1List"></div></section></section>
</div><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script>
const API='https://tcpgckvbkqpoaobncmou.supabase.co/functions/v1/cogs187a-instructor-api';
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function setMsg(t,cls='muted'){const el=document.getElementById('loginMsg');el.textContent=t;el.className=cls;}
const THEMES=[
  {name:'Beginner-friendly design',terms:['beginner','beginners','novice','new user','new users','easy to use','simple','simplified','friendly to beginners']},
  {name:'Phone / device inclusivity',terms:['phone camera','phone cameras','smartphone','mobile camera','device','devices','equipment','camera ownership','dslr']},
  {name:'Onboarding / joining',terms:['join','joining','onboarding','sign up','signup','membership','getting started']},
  {name:'Language / tone changes',terms:['language','tone','wording','copy','terminology','jargon','technical language','friendly language']},
  {name:'Navigation / information architecture',terms:['navigation','nav','menu','information architecture','hierarchy','layout','structure','section order','organization']},
  {name:'Accessibility / inclusivity',terms:['accessible','accessibility','inclusive','inclusivity','welcoming','welcomes','accommodate','different skill levels']},
  {name:'Visual design / imagery',terms:['visual','imagery','image','images','photo','photos','hero','color','design style','aesthetic']},
  {name:'Events / activities',terms:['event','events','activity','activities','workshop','meetup','photo walk','photowalk']}
];
const ASSUMPTIONS=[
  {name:'Assumed prior photography experience',terms:['assumed experience','experienced','expert','advanced','prior knowledge','already knew','knowledge of photography']},
  {name:'Assumed dedicated camera ownership',terms:['dslr','mirrorless','professional camera','dedicated camera','camera equipment','camera ownership','expensive equipment']},
  {name:'Assumed technical familiarity',terms:['technical','jargon','aperture','iso','shutter','terminology','settings']},
  {name:'Assumed event or club preferences',terms:['assumed events','event preferences','workshop','photo walk','photowalk','competition','contest']},
  {name:'Asked for more user context',terms:['asked','question','questions','clarify','clarification','more information','more context']}
];
function joinedText(row){
  return [row.strongest_finding,row.visible_evidence,row.ai_question_or_assumption,row.remaining_problem].join(' ').toLowerCase();
}
function countThemes(rows,defs){
  return defs.map(d=>{
    let count=0;
    for(const row of rows){
      const t=joinedText(row);
      if(d.terms.some(term=>t.includes(term))) count++;
    }
    return Object.assign({},d,{count});
  }).filter(d=>d.count>0).sort((a,b)=>b.count-a.count);
}
function studentCount(rows){
  const names=new Set();
  for(const r of rows){
    String(r.student_names||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(n=>names.add(n.toLowerCase()));
  }
  return names.size;
}
function primaryThemeForRow(row){
  const text=joinedText(row);
  let best=null;
  let bestScore=0;
  for(const theme of THEMES){
    const score=theme.terms.reduce((n,term)=>n+(text.includes(term)?1:0),0);
    if(score>bestScore){best=theme.name;bestScore=score;}
  }
  return best || 'Other / unclear';
}
function primaryThemeCounts(rows){
  const counts={};
  for(const row of rows){
    const name=primaryThemeForRow(row);
    counts[name]=(counts[name]||0)+1;
  }
  return Object.entries(counts).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
}
function canonicalTool(name){
  const raw=String(name||'').trim();
  const s=raw.toLowerCase();
  if(!s) return 'Unknown';
  if(s.includes('chatgpt')||s==='gpt'||s.includes('openai')) return 'ChatGPT';
  if(s.includes('claude')) return 'Claude';
  if(s.includes('gemini')||s.includes('google ai')) return 'Gemini';
  if(s.includes('copilot')) return 'Copilot';
  if(s.includes('perplexity')) return 'Perplexity';
  if(s.includes('grok')) return 'Grok';
  return raw.length>22 ? raw.slice(0,22)+'…' : raw;
}
function toolsForRow(row){
  return [...new Set([canonicalTool(row.tool_1),canonicalTool(row.tool_2)].filter(t=>t!=='Unknown'))];
}
function toolUsage(rows){
  const counts={};
  for(const row of rows){
    for(const tool of toolsForRow(row)) counts[tool]=(counts[tool]||0)+1;
  }
  return Object.entries(counts).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
}
function toolPairs(rows){
  const counts={};
  for(const row of rows){
    const pair=toolsForRow(row).sort().join(' + ') || 'Unknown';
    counts[pair]=(counts[pair]||0)+1;
  }
  return Object.entries(counts).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
}
function modelThemeMatrix(rows,defs,tools){
  return defs.map(def=>({
    name:def.name,
    values:tools.map(tool=>{
      let count=0;
      for(const row of rows){
        if(!toolsForRow(row).includes(tool)) continue;
        const text=joinedText(row);
        if(def.terms.some(term=>text.includes(term))) count++;
      }
      return count;
    })
  }));
}
function renderOverview(rows){
  const overview=document.getElementById('overview');
  if(!rows.length){
    overview.innerHTML='<div class="card"><h2>Class Overview</h2><p class="muted">No submissions yet.</p></div>';
    return;
  }
  const themes=countThemes(rows,THEMES);
  const assumptions=countThemes(rows,ASSUMPTIONS);
  const max=Math.max(1,...themes.map(x=>x.count));
  const top=themes[0], top2=themes[1];
  const takeawayParts=[];
  if(top) takeawayParts.push(top.count+' of '+rows.length+' groups referenced '+top.name.toLowerCase()+'.');
  if(top2) takeawayParts.push(top2.count+' groups also referenced '+top2.name.toLowerCase()+'.');
  if(assumptions[0]) takeawayParts.push('The most common detected AI assumption was “'+assumptions[0].name+',” appearing in '+assumptions[0].count+' group response'+(assumptions[0].count===1?'':'s')+'.');

  const primary=primaryThemeCounts(rows);
  const usage=toolUsage(rows);
  const pairs=toolPairs(rows);
  const topTools=usage.slice(0,4).map(x=>x.name);
  const modelThemes=modelThemeMatrix(rows,THEMES.slice(0,6),topTools);
  const modelAssumptions=modelThemeMatrix(rows,ASSUMPTIONS,topTools);

  const assumptionList=assumptions.length
    ? assumptions.slice(0,5).map(a=>'<li><b>'+esc(a.name)+'</b> — '+a.count+' group'+(a.count===1?'':'s')+'</li>').join('')
    : '<li>No repeated assumptions detected yet.</li>';

  overview.innerHTML=
    '<div class="card"><h2>Class Overview</h2><div class="summary-grid">'+
      '<div class="metric"><div class="num">'+rows.length+'</div><div class="lab">Group submissions</div></div>'+
      '<div class="metric"><div class="num">'+studentCount(rows)+'</div><div class="lab">Students listed</div></div>'+
      '<div class="metric"><div class="num">'+(rows.length*2)+'</div><div class="lab">AI tool comparisons</div></div>'+
      '<div class="metric"><div class="num">'+themes.length+'</div><div class="lab">Common themes detected</div></div>'+
    '</div></div>'+
    '<div class="charts-grid">'+
      '<div class="card chart-card"><h2>What changed when AI knew more about the user?</h2><p class="summary-note">Bar chart: groups can contribute to multiple themes.</p><div class="chart-wrap"><canvas id="themesBar"></canvas></div></div>'+
      '<div class="card chart-card"><h2>Primary theme by group</h2><p class="summary-note">Pie chart: each group is assigned one strongest detected theme so the slices sum to the full class.</p><div class="chart-wrap"><canvas id="themesPie"></canvas></div></div>'+
    '</div>'+
    '<div class="card model-section"><h2>LLM Comparison</h2><p class="summary-note">Model-level views show patterns among groups that used each tool. Because each group submitted one shared written reflection for two tools, these charts show association with tool usage—not proof that a specific model caused the theme.</p></div>'+
    '<div class="charts-grid">'+
      '<div class="card chart-card"><h2>AI tools used</h2><p class="summary-note">Number of group submissions that included each tool.</p><div class="chart-wrap"><canvas id="toolUsageChart"></canvas></div></div>'+
      '<div class="card chart-card"><h2>Most common tool pairings</h2><p class="summary-note">Which two tools groups compared.</p><div class="pair-grid">'+pairs.slice(0,8).map(p=>'<span class="pair-pill">'+esc(p.name)+' · '+p.count+' group'+(p.count===1?'':'s')+'</span>').join('')+'</div></div>'+
    '</div>'+
    '<div class="charts-grid">'+
      '<div class="card chart-card"><h2>Themes among groups using each LLM</h2><p class="summary-note">Grouped counts by model. A group can contribute to multiple themes and to both models it used.</p><div class="chart-wrap"><canvas id="modelThemesChart"></canvas></div></div>'+
      '<div class="card chart-card"><h2>AI assumptions among groups using each LLM</h2><p class="summary-note">Detected assumption patterns in the shared reflections of groups using each model.</p><div class="chart-wrap"><canvas id="modelAssumptionsChart"></canvas></div></div>'+
    '</div>'+
    '<div class="grid"><div class="card"><h2>Common AI assumptions</h2><ul class="theme-list">'+assumptionList+'</ul></div>'+
    '<div class="card"><h2>Collective takeaway</h2><p class="takeaway">'+esc(takeawayParts.join(' '))+'</p><p class="summary-note">This is a lightweight thematic summary based on keyword matching in submitted text, intended to support class discussion rather than serve as a formal qualitative coding result.</p></div></div>';

  if(window.Chart){
    const barCtx=document.getElementById('themesBar');
    const pieCtx=document.getElementById('themesPie');
    if(barCtx){
      new Chart(barCtx,{
        type:'bar',
        data:{
          labels:themes.map(t=>t.name),
          datasets:[{label:'Groups mentioning theme',data:themes.map(t=>t.count),backgroundColor:'#182b49'}]
        },
        options:{
          indexAxis:'y',
          responsive:true,
          maintainAspectRatio:false,
          plugins:{legend:{display:false},tooltip:{callbacks:{label:(ctx)=>ctx.raw+' of '+rows.length+' groups'}}},
          scales:{x:{beginAtZero:true,ticks:{precision:0},suggestedMax:rows.length},y:{ticks:{autoSkip:false}}}
        }
      });
    }
    if(pieCtx){
      new Chart(pieCtx,{
        type:'pie',
        data:{
          labels:primary.map(p=>p.name),
          datasets:[{data:primary.map(p=>p.count)}]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          plugins:{
            legend:{position:'bottom',labels:{boxWidth:12}},
            tooltip:{callbacks:{label:(ctx)=>ctx.label+': '+ctx.raw+' group'+(ctx.raw===1?'':'s')}}
          }
        }
      });
    }

    const usageCtx=document.getElementById('toolUsageChart');
    if(usageCtx){
      new Chart(usageCtx,{
        type:'bar',
        data:{labels:usage.map(u=>u.name),datasets:[{label:'Groups',data:usage.map(u=>u.count)}]},
        options:{
          responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false},tooltip:{callbacks:{label:(ctx)=>ctx.raw+' group'+(ctx.raw===1?'':'s')}}},
          scales:{y:{beginAtZero:true,ticks:{precision:0}}}
        }
      });
    }

    const modelThemesCtx=document.getElementById('modelThemesChart');
    if(modelThemesCtx && topTools.length){
      new Chart(modelThemesCtx,{
        type:'bar',
        data:{
          labels:modelThemes.map(x=>x.name),
          datasets:topTools.map((tool,i)=>({label:tool,data:modelThemes.map(x=>x.values[i])}))
        },
        options:{
          responsive:true,maintainAspectRatio:false,
          plugins:{legend:{position:'bottom'}},
          scales:{x:{ticks:{maxRotation:45,minRotation:20}},y:{beginAtZero:true,ticks:{precision:0}}}
        }
      });
    }

    const modelAssumptionsCtx=document.getElementById('modelAssumptionsChart');
    if(modelAssumptionsCtx && topTools.length){
      new Chart(modelAssumptionsCtx,{
        type:'bar',
        data:{
          labels:modelAssumptions.map(x=>x.name),
          datasets:topTools.map((tool,i)=>({label:tool,data:modelAssumptions.map(x=>x.values[i])}))
        },
        options:{
          indexAxis:'y',
          responsive:true,maintainAspectRatio:false,
          plugins:{legend:{position:'bottom'}},
          scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{ticks:{autoSkip:false}}}
        }
      });
    }
  }
}
function countBy(rows,key){
  const counts={};
  for(const r of rows){const v=String(r[key]||'').trim()||'Unspecified';counts[v]=(counts[v]||0)+1;}
  return Object.entries(counts).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
}
function countArrayValues(rows,key){
  const counts={};
  for(const r of rows){for(const v of (r[key]||[])){counts[v]=(counts[v]||0)+1;}}
  return Object.entries(counts).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
}
function renderActivity1(rows){
  const root=document.getElementById('activity1Overview'), list=document.getElementById('activity1List');
  if(!rows.length){root.innerHTML='<div class="card"><h2>Class Activity 1 · Personalized Information Architecture</h2><p class="muted">No Activity 1 submissions yet. This page will update as groups submit.</p></div>';list.innerHTML='';return;}
  const adapt=countBy(rows,'ia_adaptation'), boundary=countBy(rows,'personalization_boundary'), pdata=countArrayValues(rows,'personalization_data');
  const maya=countBy(rows,'maya_primary'), daniel=countBy(rows,'daniel_primary'), sam=countBy(rows,'sam_primary');
  const students=studentCount(rows);
  root.innerHTML=
    '<div class="card"><h2>Class Activity 1 · Personalized Information Architecture</h2><div class="summary-grid">'+
    '<div class="metric"><div class="num">'+rows.length+'</div><div class="lab">Group submissions</div></div>'+
    '<div class="metric"><div class="num">'+students+'</div><div class="lab">Students listed</div></div>'+
    '<div class="metric"><div class="num">'+(adapt[0]?.name||'—')+'</div><div class="lab">Most common adaptation stance</div></div>'+
    '<div class="metric"><div class="num">'+(boundary[0]?.count||0)+'</div><div class="lab">Groups in leading data-boundary choice</div></div></div></div>'+
    '<div class="charts-grid"><div class="card chart-card"><h2>How much should the information architecture adapt?</h2><p class="summary-note">Each group selected one position.</p><div class="chart-wrap"><canvas id="a1AdaptChart"></canvas></div></div>'+
    '<div class="card chart-card"><h2>Where should personalization stop?</h2><p class="summary-note">Each group selected one data-use boundary.</p><div class="chart-wrap"><canvas id="a1BoundaryChart"></canvas></div></div></div>'+
    '<div class="card chart-card"><h2>What data may the system use?</h2><p class="summary-note">Groups could select multiple data sources.</p><div class="chart-wrap"><canvas id="a1DataChart"></canvas></div></div>'+
    '<div class="card chart-card"><h2>Highest-priority content by persona</h2><p class="summary-note">Compare what groups put first for Maya, Daniel, and Sam.</p><div class="chart-wrap"><canvas id="a1PersonaChart"></canvas></div></div>'+
    '<div class="grid"><div class="card"><h2>Design principles from the class</h2>'+rows.slice(0,6).map(r=>'<div class="quote"><b>'+esc(r.group_name)+':</b> '+esc(r.design_principle)+'</div>').join('')+'</div>'+
    '<div class="card"><h2>Discussion prompts from the results</h2><ul class="theme-list"><li>Did the class favor stable navigation with personalized priorities, or fully different structures?</li><li>Which persona produced the strongest agreement about what should come first?</li><li>Which data sources created the most disagreement?</li><li>Where is the tradeoff between relevance and a stable mental model?</li></ul></div></div>';

  if(window.Chart){
    new Chart(document.getElementById('a1AdaptChart'),{type:'bar',data:{labels:adapt.map(x=>x.name),datasets:[{data:adapt.map(x=>x.count),label:'Groups'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{ticks:{maxRotation:35,minRotation:15}}}}});
    new Chart(document.getElementById('a1BoundaryChart'),{type:'pie',data:{labels:boundary.map(x=>x.name),datasets:[{data:boundary.map(x=>x.count)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12}}}}});
    new Chart(document.getElementById('a1DataChart'),{type:'bar',data:{labels:pdata.map(x=>x.name),datasets:[{data:pdata.map(x=>x.count),label:'Groups allowing use'}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{ticks:{autoSkip:false}}}}});
    const cats=[...new Set([...maya,...daniel,...sam].map(x=>x.name))];
    const mapVals=arr=>cats.map(k=>arr.find(x=>x.name===k)?.count||0);
    new Chart(document.getElementById('a1PersonaChart'),{type:'bar',data:{labels:cats,datasets:[{label:'Maya',data:mapVals(maya)},{label:'Daniel',data:mapVals(daniel)},{label:'Sam',data:mapVals(sam)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{ticks:{maxRotation:45,minRotation:20}}}}});
  }
  list.innerHTML='';
  for(const r of rows){
    const el=document.createElement('article');el.className='card';
    el.innerHTML='<h2>'+esc(r.group_name)+'</h2><p><b>Students:</b> '+esc(r.student_names)+'</p><div class="grid"><div class="field"><b>Maya</b>'+esc(r.maya_primary)+' · '+esc(r.maya_cta)+'</div><div class="field"><b>Daniel</b>'+esc(r.daniel_primary)+' · '+esc(r.daniel_cta)+'</div><div class="field"><b>Sam</b>'+esc(r.sam_primary)+' · '+esc(r.sam_cta)+'</div><div class="field"><b>Adaptation stance</b>'+esc(r.ia_adaptation)+'</div><div class="field"><b>Personalization boundary</b>'+esc(r.personalization_boundary)+'</div><div class="field"><b>Allowed data</b>'+esc((r.personalization_data||[]).join(', ')||'None selected')+'</div><div class="field"><b>Biggest benefit</b>'+esc(r.biggest_benefit)+'</div><div class="field"><b>Biggest risk</b>'+esc(r.biggest_risk)+'</div><div class="field" style="grid-column:1/-1"><b>Design principle</b>'+esc(r.design_principle)+'</div></div>';
    list.appendChild(el);
  }
}
function render(rows){
  document.getElementById('count').textContent=`${rows.length} group submission${rows.length===1?'':'s'}`;
  renderOverview(rows);
  const list=document.getElementById('list'); list.innerHTML='';
  for(const row of rows){
    const urls=row.screenshot_urls||[];
    const c=document.createElement('article'); c.className='card';
    c.innerHTML=`<h2>${esc(row.group_name)}</h2><p><span class="pill">${esc(row.tool_1)}</span><span class="pill">${esc(row.tool_2)}</span></p><p><b>Students:</b> ${esc(row.student_names)}</p><div class="shots">${urls.map((u,i)=>`<div><div class="muted" style="font-size:12px;margin-bottom:5px">${['Tool 1 · without audience','Tool 1 · with audience','Tool 2 · without audience','Tool 2 · with audience'][i]}</div><img src="${u}" alt="Submitted screenshot ${i+1}"></div>`).join('')}</div><div class="grid" style="margin-top:12px"><div class="field"><b>Strongest finding</b>${esc(row.strongest_finding)}</div><div class="field"><b>Visible evidence</b>${esc(row.visible_evidence)}</div><div class="field"><b>AI question / assumption</b>${esc(row.ai_question_or_assumption)}</div><div class="field"><b>Remaining problem</b>${esc(row.remaining_problem)}</div></div>`;
    list.appendChild(c);
  }
}
async function login(){
  const btn=document.getElementById('signIn');
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  if(!email||!password){setMsg('Enter email and password.','error');return;}
  btn.disabled=true; setMsg('Signing in…');
  try{
    const res=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});
    const body=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(body.error||'Unable to sign in.');
    sessionStorage.setItem('cogs187a_email',email);
    sessionStorage.setItem('cogs187a_password',password);
    document.getElementById('login').style.display='none';
    document.getElementById('dash').style.display='block';
    const a0=body.submissions||[], a1=body.activity1_submissions||[];
    render(a0);
    renderActivity1(a1);
    document.getElementById('count').textContent=a0.length+' Activity 0 groups · '+a1.length+' Activity 1 groups';
  }catch(e){setMsg(e.message||'Unable to sign in.','error');btn.disabled=false;}
}
document.querySelectorAll('.tabbtn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.activity-panel').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.target).classList.add('active');}));
document.getElementById('signIn').onclick=login;
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('signOut').onclick=()=>{sessionStorage.clear();location.reload();};
(async()=>{const email=sessionStorage.getItem('cogs187a_email'),password=sessionStorage.getItem('cogs187a_password');if(email&&password){document.getElementById('email').value=email;document.getElementById('password').value=password;await login();}})();
</script></body></html>
