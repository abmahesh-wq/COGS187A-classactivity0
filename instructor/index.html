<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COGS 187A — Instructor Review</title><style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7f8fb;color:#111827}.wrap{max-width:1200px;margin:auto;padding:32px 20px}.bar{display:flex;justify-content:space-between;gap:16px;align-items:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:16px 0}.login{max-width:430px;margin:80px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shots img{width:100%;height:260px;object-fit:contain;background:#f4f6f8;border-radius:10px;border:1px solid #e5e7eb}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d0d5dd;border-radius:9px;margin:6px 0 12px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;background:#182b49;color:#fff;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.muted{color:#667085}.error{color:#b42318}.success{color:#146c43}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef3f8;font-size:12px;margin-right:6px}.field{padding:12px;background:#fafafa;border-radius:10px}.field b{display:block;font-size:12px;margin-bottom:5px;color:#475467}@media(max-width:760px){.grid,.shots{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<section id="login" class="card login"><h1>Instructor Review</h1><div style="font-size:12px;color:#667085;margin-bottom:10px">Version: auth-fix-2</div><p class="muted">Sign in with an authorized instructor account.</p><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="abmahesh@ucsd.edu"><label>Password</label><input id="password" type="password" autocomplete="current-password"><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" id="signIn">Sign in</button><button type="button" class="btn" id="createAccount" style="background:#fff;color:#182b49;border:1px solid #182b49">First time? Create account</button></div><p id="loginMsg" class="muted"></p></section>
<section id="dash" style="display:none"><div class="bar"><div><h1>COGS 187A · Activity 0</h1><p class="muted" id="count"></p></div><button type="button" class="btn" id="signOut">Sign out</button></div><div id="list"></div></section>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.COGS187A_CONFIG;
const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
const AUTHORIZED_EMAILS=['abmahesh@ucsd.edu','kirsh@ucsd.edu'];

function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function setMsg(text,type='muted'){const el=document.getElementById('loginMsg');el.textContent=text;el.className=type;}
function getCredentials(){
  return {
    email:document.getElementById('email').value.trim().toLowerCase(),
    password:document.getElementById('password').value
  };
}
function validateCredentials(email,password){
  if(!email||!password) return 'Enter your email and password.';
  if(!AUTHORIZED_EMAILS.includes(email)) return 'This email is not authorized for the instructor dashboard.';
  if(password.length<8) return 'Use a password with at least 8 characters.';
  return null;
}
async function clearAnonymousSession(){
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user?.is_anonymous){
    await sb.auth.signOut({scope:'local'});
  }
}
async function signedUrl(path){const {data,error}=await sb.storage.from('activity-screenshots').createSignedUrl(path,3600);if(error)return '';return data.signedUrl;}
async function load(){
  const {data,error}=await sb.from('activity_submissions').select('*').order('created_at',{ascending:true});
  if(error) throw new Error('This account is not authorized for the COGS 187A instructor dashboard.');
  document.getElementById('count').textContent=`${data.length} group submission${data.length===1?'':'s'}`;
  const list=document.getElementById('list'); list.innerHTML='';
  for(const row of data){
    const urls=await Promise.all([row.screenshot_1,row.screenshot_2,row.screenshot_3,row.screenshot_4].map(signedUrl));
    const c=document.createElement('article'); c.className='card';
    c.innerHTML=`<h2>${esc(row.group_name)}</h2><p><span class="pill">${esc(row.tool_1)}</span><span class="pill">${esc(row.tool_2)}</span></p><p><b>Students:</b> ${esc(row.student_names)}</p><div class="shots">${urls.map((u,i)=>`<div><div class="muted" style="font-size:12px;margin-bottom:5px">${['Tool 1 · without audience','Tool 1 · with audience','Tool 2 · without audience','Tool 2 · with audience'][i]}</div><img src="${u}" alt="Submitted screenshot ${i+1}"></div>`).join('')}</div><div class="grid" style="margin-top:12px"><div class="field"><b>Strongest finding</b>${esc(row.strongest_finding)}</div><div class="field"><b>Visible evidence</b>${esc(row.visible_evidence)}</div><div class="field"><b>AI question / assumption</b>${esc(row.ai_question_or_assumption)}</div><div class="field"><b>Remaining problem</b>${esc(row.remaining_problem)}</div></div>`;
    list.appendChild(c);
  }
}
async function showDashboardIfSignedIn(){
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user && !session.user.is_anonymous){
    const email=(session.user.email||'').toLowerCase();
    if(!AUTHORIZED_EMAILS.includes(email)){
      await sb.auth.signOut({scope:'local'});
      setMsg('This account is not authorized for the instructor dashboard.','error');
      return;
    }
    document.getElementById('login').style.display='none';
    document.getElementById('dash').style.display='block';
    load().catch(e=>document.getElementById('list').innerHTML=`<div class="card">${esc(e.message)}</div>`);
  }
}

document.getElementById('signIn').addEventListener('click',async()=>{
  const btn=document.getElementById('signIn');
  const {email,password}=getCredentials();
  const validation=validateCredentials(email,password);
  if(validation){setMsg(validation,'error');return;}
  btn.disabled=true; setMsg('Signing in…');
  try{
    await clearAnonymousSession();
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    if(!data.session) throw new Error('Sign-in did not create a session.');
    location.reload();
  }catch(error){
    setMsg(error.message || 'Unable to sign in.','error');
    btn.disabled=false;
  }
});

document.getElementById('createAccount').addEventListener('click',async()=>{
  const btn=document.getElementById('createAccount');
  const {email,password}=getCredentials();
  const validation=validateCredentials(email,password);
  if(validation){setMsg(validation,'error');return;}
  btn.disabled=true; setMsg('Creating instructor account…');
  try{
    await clearAnonymousSession();
    const {data,error}=await sb.auth.signUp({
      email,
      password,
      options:{emailRedirectTo:location.origin + '/instructor'}
    });
    if(error) throw error;

    if(data.user?.identities && data.user.identities.length===0){
      setMsg('An account already exists for this email. Use Sign in or reset the password in Supabase Auth.','error');
      btn.disabled=false;
      return;
    }

    if(data.session){
      setMsg('Account created. Signing you in…','success');
      location.reload();
      return;
    }

    setMsg('Account created. Check your UCSD email for the confirmation link, then return here and sign in.','success');
    btn.disabled=false;
  }catch(error){
    setMsg(error.message || 'Unable to create the account.','error');
    btn.disabled=false;
  }
});

document.getElementById('signOut').addEventListener('click',async()=>{await sb.auth.signOut();location.reload();});
showDashboardIfSignedIn();
</script></body></html>
