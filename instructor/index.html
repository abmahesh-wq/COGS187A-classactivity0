<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COGS 187A — Instructor Review</title><style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7f8fb;color:#111827}.wrap{max-width:1200px;margin:auto;padding:32px 20px}.bar{display:flex;justify-content:space-between;gap:16px;align-items:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:16px 0}.login{max-width:430px;margin:80px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shots img{width:100%;height:260px;object-fit:contain;background:#f4f6f8;border-radius:10px;border:1px solid #e5e7eb}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d0d5dd;border-radius:9px;margin:6px 0 12px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;background:#182b49;color:#fff;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.muted{color:#667085}.error{color:#b42318}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef3f8;font-size:12px;margin-right:6px}.field{padding:12px;background:#fafafa;border-radius:10px}.field b{display:block;font-size:12px;margin-bottom:5px;color:#475467}@media(max-width:760px){.grid,.shots{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<section id="login" class="card login"><h1>Instructor Review</h1><p class="muted">Sign in with the shared instructor credential for this course.</p><label>Email</label><input id="email" type="email" autocomplete="username" value="admincogs187a@ucsd.edu"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button type="button" class="btn" id="signIn">Sign in</button><p id="loginMsg" class="muted"></p></section>
<section id="dash" style="display:none"><div class="bar"><div><h1>COGS 187A · Activity 0</h1><p class="muted" id="count"></p></div><button type="button" class="btn" id="signOut">Sign out</button></div><div id="list"></div></section>
</div><script>
const API='https://tcpgckvbkqpoaobncmou.supabase.co/functions/v1/cogs187a-instructor-api';
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function setMsg(t,cls='muted'){const el=document.getElementById('loginMsg');el.textContent=t;el.className=cls;}
function render(rows){
  document.getElementById('count').textContent=`${rows.length} group submission${rows.length===1?'':'s'}`;
  const list=document.getElementById('list'); list.innerHTML='';
  for(const row of rows){
    const urls=row.screenshot_urls||[];
    const c=document.createElement('article'); c.className='card';
    c.innerHTML=`<h2>${esc(row.group_name)}</h2><p><span class="pill">${esc(row.tool_1)}</span><span class="pill">${esc(row.tool_2)}</span></p><p><b>Students:</b> ${esc(row.student_names)}</p><div class="shots">${urls.map((u,i)=>`<div><div class="muted" style="font-size:12px;margin-bottom:5px">${['Tool 1 · without audience','Tool 1 · with audience','Tool 2 · without audience','Tool 2 · with audience'][i]}</div><img src="${u}" alt="Submitted screenshot ${i+1}"></div>`).join('')}</div><div class="grid" style="margin-top:12px"><div class="field"><b>Strongest finding</b>${esc(row.strongest_finding)}</div><div class="field"><b>Visible evidence</b>${esc(row.visible_evidence)}</div><div class="field"><b>AI question / assumption</b>${esc(row.ai_question_or_assumption)}</div><div class="field"><b>Remaining problem</b>${esc(row.remaining_problem)}</div></div>`;
    list.appendChild(c);
  }
}
async function login(){
  const btn=document.getElementById('signIn');
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  if(!email||!password){setMsg('Enter email and password.','error');return;}
  btn.disabled=true; setMsg('Signing in…');
  try{
    const res=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});
    const body=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(body.error||'Unable to sign in.');
    sessionStorage.setItem('cogs187a_email',email);
    sessionStorage.setItem('cogs187a_password',password);
    document.getElementById('login').style.display='none';
    document.getElementById('dash').style.display='block';
    render(body.submissions||[]);
  }catch(e){setMsg(e.message||'Unable to sign in.','error');btn.disabled=false;}
}
document.getElementById('signIn').onclick=login;
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('signOut').onclick=()=>{sessionStorage.clear();location.reload();};
(async()=>{const email=sessionStorage.getItem('cogs187a_email'),password=sessionStorage.getItem('cogs187a_password');if(email&&password){document.getElementById('email').value=email;document.getElementById('password').value=password;await login();}})();
</script></body></html>
